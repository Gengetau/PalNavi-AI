[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "palnavi"
version = "1.0.0rc1"
description = "Deterministic local services for PalNavi AI"
readme = {text = "Deterministic local services for PalNavi AI.", content-type = "text/plain"}
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["palnavi"]
strict = true
